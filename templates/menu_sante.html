<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <title>Menu Santé - Laure</title>
    <style>
        body {
            background: url('https://images.unsplash.com/photo-1532938911079-1b06ac7ceec7?q=80&w=1632&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', sans-serif;
        }
        .overlay { background: rgba(0, 0, 0, 0.7); min-height: 100vh; padding: 60px 0; }
        .card-custom {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            color: white;
            text-decoration: none !important;
            transition: transform 0.3s ease;
            display: block;
            height: 100%;
        }
        .card-custom:hover { transform: translateY(-10px); color: #00d4ff; border-color: #00d4ff; }
        .icon-size { font-size: 4rem; margin-bottom: 15px; display: block; }
    </style>
</head>
<body>
    <div class="overlay">
        <div class="container text-center">
            <h1 class="text-white mb-5 fw-bold">Système de Collecte Santé 🇨🇲</h1>
            <div class="row g-4 justify-content-center">
                
                <div class="col-md-4">
                    <a href="/form_sante?maladie=Diabète" class="card-custom shadow">
                        <span class="icon-size">🩸</span>
                        <h3>Analyse Diabète</h3>
                        <p class="small opacity-75">Saisie des taux de glycémie</p>
                    </a>
                </div>

                <div class="col-md-4">
                    <a href="/form_sante?maladie=Hypertension" class="card-custom shadow">
                        <span class="icon-size">❤️</span>
                        <h3>Hypertension</h3>
                        <p class="small opacity-75">Suivi de la tension artérielle</p>
                    </a>
                </div>

                <div class="col-md-4">
                    <a href="/form_sante?maladie=Cancer" class="card-custom shadow">
                        <span class="icon-size">🧬</span>
                        <h3>Module Cancer</h3>
                        <p class="small opacity-75">Collecte des marqueurs tumoraux</p>
                    </a>
                </div>

            </div>
            <div class="mt-5">
                <a href="/" class="btn btn-outline-light px-5 py-2">🏠 Retour au Menu Principal</a>
            </div>
        </div>
    </div>
</body>
</html>
